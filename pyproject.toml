[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vivid"
version = "1.0.0"
description = "Independent per-display saturation control for KDE Plasma Wayland"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vivid contributors" }]
keywords = ["kde", "plasma", "wayland", "kwin", "icc", "saturation", "vibrance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
  "Topic :: Multimedia :: Graphics :: Color Management",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/rj-roy/vivid"
Documentation = "https://github.com/rj-roy/vivid/tree/main/docs"
Issues = "https://github.com/rj-roy/vivid/issues"

[project.scripts]
vivid = "vivid.cli:main"
vivid-gui = "vivid.ui.main_window:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vivid = ["py.typed", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "hardware: requires two real displays and a live Plasma Wayland session",
  "integration: requires a live Plasma/KWin session",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["vivid"]
ignore_missing_imports = true
warn_unused_ignores = true
